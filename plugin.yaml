sensor:
  - platform: sht4x
    i2c_id: touch_bus
    address: 0x44
    temperature:
      name: "Temperature"
      id: temperature
      device_class: temperature
      state_class: measurement
      accuracy_decimals: 2
    humidity:
      name: "Humidity"
      id: humidity
      device_class: humidity
      state_class: measurement
      accuracy_decimals: 1
    update_interval: 5s
