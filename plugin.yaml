i2c:
  - id: sht45_i2c
    sda: GPIO40
    scl: GPIO2
    scan: true
    frequency: 100kHz

sensor:
  - platform: sht4x
    i2c_id: sht45_i2c
    address: 0x44
    temperature:
      name: "Raumtemperatur"
      id: sht45_temperature
      device_class: temperature
      state_class: measurement
      accuracy_decimals: 2
    humidity:
      name: "Luftfeuchtigkeit"
      id: sht45_humidity
      device_class: humidity
      state_class: measurement
      accuracy_decimals: 1
    update_interval: 5s
